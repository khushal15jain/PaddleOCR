name: Tests

on:
  push:
    branches: [ main, fix/benchmark-cleanup ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng libgl1-mesa-glx

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml pillow numpy pandas scipy jiwer rapidfuzz tabulate pytesseract opencv-python-headless deep-translator matplotlib seaborn

      - name: Run pytest
        run: |
          export PYTHONPATH=.
          export OCR_BENCHMARK_SKIP_TRANSLATION=1
          pytest tests/ -v
