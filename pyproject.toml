[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr_benchmark"
version = "2.0.0"
description = "A Reproducible Benchmarking Framework for Printed and Handwritten Historical Document OCR Using PaddleOCR and Tesseract with Ground-Truth-Based Accuracy Evaluation"
authors = [
    { name = "OCR Researcher" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=3.0.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "jiwer>=4.0.0",
    "rapidfuzz>=3.6.1",
    "matplotlib>=3.8.3",
    "seaborn>=0.13.2",
    "scipy>=1.12.0",
    "tqdm>=4.66.2",
    "PyYAML>=6.0.1",
    "streamlit>=1.32.0",
    "pytest>=8.0.0",
    "tabulate>=0.9.0",
    "deep-translator>=1.11.4"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
